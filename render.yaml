# Render Blueprint: https://render.com/docs/blueprint-spec
# Free web service built from the Dockerfile; the database lives on Neon (free tier).
# Values marked `sync: false` are asked for when the Blueprint is created.
services:
    - type: web
      name: secret-santa
      runtime: docker
      plan: free
      dockerfilePath: ./Dockerfile
      healthCheckPath: /up
      autoDeploy: true
      envVars:
          - key: APP_NAME
            value: Secret Santa
          - key: APP_ENV
            value: production
          - key: APP_DEBUG
            value: 'false'
          # Generate locally with: php artisan key:generate --show
          - key: APP_KEY
            sync: false
          # e.g. https://secret-santa.onrender.com
          - key: APP_URL
            sync: false
          - key: APP_LOCALE
            value: pt_BR
          - key: APP_FALLBACK_LOCALE
            value: en

          # Neon connection string, e.g. postgresql://user:pass@ep-xxx.region.aws.neon.tech/neondb?sslmode=require
          - key: DB_CONNECTION
            value: pgsql
          - key: DB_URL
            sync: false

          # The filesystem is ephemeral and there are no workers or cron on the free plan.
          - key: SESSION_DRIVER
            value: database
          - key: SESSION_SECURE_COOKIE
            value: 'true'
          - key: CACHE_STORE
            value: database
          - key: QUEUE_CONNECTION
            value: sync
          - key: LOG_CHANNEL
            value: stderr
          - key: LOG_LEVEL
            value: info

          # Free Render services cannot open SMTP connections, so use an HTTP API mailer.
          # Leave MAIL_MAILER=log to run without email (sign-in codes are then hidden).
          - key: MAIL_MAILER
            value: log
          - key: MAIL_FROM_ADDRESS
            sync: false
          - key: RESEND_API_KEY
            sync: false

          # Optional: "Continue with Google". Callback: <APP_URL>/auth/google/callback
          - key: GOOGLE_CLIENT_ID
            sync: false
          - key: GOOGLE_CLIENT_SECRET
            sync: false
